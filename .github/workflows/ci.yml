name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Lint with ruff
        run: |
          ruff check .

      - name: Security scan with bandit
        run: |
          bandit -ll -r core desktop

      - name: Audit dependencies with pip-audit
        run: |
          pip-audit

      - name: Run test suite with coverage
        run: |
          pytest --cov=core --cov=desktop --cov-report=term-missing

      - name: Verify Golden Accuracy Baseline
        run: |
          python -c "import json; b = json.load(open('tests/accuracy_baseline.json')); assert b['pass_rate_percent'] >= 86.29, f'Accuracy regression: {b}'"
